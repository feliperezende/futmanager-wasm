<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FutManager 98 — Gerenciador de Futebol</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="window" id="app">
  <div class="titlebar"><span class="wm-caption">⚽ FutManager 98</span><span class="tb-btns" id="mainBtns"></span></div>
  <div id="start" class="panel">
    <h1>FutManager 98</h1>
    <p>Gerenciador de futebol com 4 divisões de clubes fictícios.</p>
    <button id="btnNew">Novo jogo</button>
    <button id="btnLoad">Carregar jogo salvo</button>
    <div id="pickTeam" class="hidden">
      <h2>Escolha seu clube</h2>
      <select id="pickDiv"></select>
      <div id="teamList" class="list"></div>
    </div>
  </div>
  <div id="main" class="hidden">
    <div class="menubar">
      <button data-tab="clube" title="Elenco, escalação e tática">Clube</button>
      <button data-tab="jogos" title="Jogar a próxima rodada ao vivo">Rodada</button>
      <button data-tab="tabela" title="Tabelas das 4 divisões e artilharia">Classificação</button>
      <button data-tab="mercado" title="Comprar ou pegar jogadores emprestados">Mercado</button>
      <button data-tab="base" title="Categorias de base">Base</button>
      <button data-tab="financas" title="Caixa, estádio, ingresso e banco">Finanças</button>
      <button data-tab="copa" title="Copa Nacional: chaveamento">Copa</button>
      <button data-tab="jornal" title="O Placar Diário: jornal da rodada e arquivo">Jornal</button>
      <button data-tab="times" title="Fichas de todos os clubes, por divisão">Times</button>
      <button data-tab="historico" title="Galeria de campeões e suas temporadas">Histórico</button>
      <span class="sep"></span>
      <button id="btnSave" title="Salvar em um dos 5 slots">💾 Salvar</button>
      <button id="btnQuit" title="Voltar ao menu inicial">Menu</button>
    </div>
    <div id="msg" class="msg"></div>
    <section id="tab-clube" class="tab"></section>
    <section id="tab-jogos" class="tab"></section>
    <section id="tab-tabela" class="tab"></section>
    <section id="tab-mercado" class="tab"></section>
    <section id="tab-financas" class="tab"></section>
    <section id="tab-base" class="tab"></section>
    <section id="tab-times" class="tab"></section>
  </div>
  <div class="statusbar" id="status"></div>
</div>
<div id="slots" class="modal hidden"><div class="window"><div class="titlebar"><span id="slotsTitle">Jogos salvos</span><span class="tb-btns" id="slotsBtns"></span></div><div class="panel" id="slotsBody"></div></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
