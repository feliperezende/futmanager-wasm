[package]
name = "futmanager"
version = "0.1.0"
edition = "2021"
description = "Jogo de gerenciamento de futebol original (clean-room) em Rust + WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
